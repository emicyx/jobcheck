<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; margin: 0; font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1f2733; background: #fafbfc; }
    .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(135deg, #6188d8, #3e9e8c, #d89c2e); }
    .name { font-weight: 600; letter-spacing: .1em; color: #223a5e; font-size: 13px; }
    .ver { margin-left: auto; color: #9aa4b0; font-size: 11px; }
    .body { padding: 4px 14px 14px; font-size: 13px; line-height: 1.6; }
    .muted { color: #6b7684; font-size: 12px; }
    button { width: 100%; margin-top: 10px; padding: 9px 0; border: 0; border-radius: 8px; background: #223a5e; color: #fff; font-size: 14px; cursor: pointer; }
    button.secondary { background: #eef2f7; color: #223a5e; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .ok { color: #2e7d4f; font-weight: 600; }
    .err { color: #c25a5a; font-weight: 600; }
    .warn-box { background: #fdf6e7; border: 1px solid #f0dcae; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 12px; color: #7a5b16; }
    code { background: #eef2f7; border-radius: 4px; padding: 0 4px; font-size: 11px; }
    .spin { color: #9aa4b0; padding: 16px 0; text-align: center; }
    .pair-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e6eaf0; }
    .pair-row { display: flex; gap: 8px; margin-top: 8px; }
    .pair-row input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #c9d2dd; border-radius: 8px; font-size: 15px; letter-spacing: .35em; text-align: center; }
    .pair-row button { width: auto; margin-top: 0; padding: 8px 14px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="head"><span class="dot"></span><span class="name">JobCheck</span><span class="ver" id="ver"></span></div>
  <div class="body" id="app"><div class="spin">加载中…</div></div>
  <script src="popup.js"></script>
</body>
</html>
